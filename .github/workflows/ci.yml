name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: taskapi
          POSTGRES_PASSWORD: taskapi
          POSTGRES_DB: taskapi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskapi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://taskapi:taskapi@localhost:5432/taskapi
      SECRET_KEY: ci-only-key-not-a-real-secret

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest -v

      - name: Migrations apply on an empty database
        run: |
          uv run alembic upgrade head
          uv run alembic check

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      REGION: europe-west1
      IMAGE: europe-west1-docker.pkg.dev/taskapi-509213/taskapi/taskapi:${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/810658780685/locations/global/workloadIdentityPools/github/providers/github-provider
          service_account: github-deployer@taskapi-509213.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push image
        run: |
          gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Run migrations
        run: |
          gcloud run jobs update taskapi-migrate --image "$IMAGE" --region "$REGION"
          gcloud run jobs execute taskapi-migrate --region "$REGION" --wait

      - name: Deploy
        run: gcloud run deploy taskapi --image "$IMAGE" --region "$REGION"

      - name: Smoke test
        run: |
          URL=$(gcloud run services describe taskapi --region "$REGION" --format='value(status.url)')
          curl --fail --retry 5 --retry-delay 5 --retry-all-errors "$URL/health"
